plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// Release signing is read from key.properties, which is gitignored. Without it
// a release build falls back to the debug key so `flutter build apk` still
// works locally, and the build log says so rather than failing silently.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}

android {
    namespace = "com.clinicalai.app"

    // 36 because flutter_tts, shared_preferences_android and speech_to_text are
    // each compiled against it. Compiling against the highest is safe: Android
    // SDKs are backward compatible, and targetSdk still governs runtime behaviour.
    compileSdk = 36

    // Pinned to what jni and speech_to_text require. Leaving this unset let
    // Gradle pick 27.x, which then failed against plugins expecting 28.2.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.clinicalai.app"

        // Set explicitly rather than using flutter.minSdkVersion, which can
        // resolve to 21. flutter_secure_storage needs 23 for the Android
        // Keystore's encryptedSharedPreferences, which is where the JWT lives.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35

        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKey) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("WARNING: android/key.properties not found. " +
                        "Signing the release build with the debug key. " +
                        "This build cannot be uploaded to Play.")
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
        }
    }
}

flutter {
    source = "../.."
}
